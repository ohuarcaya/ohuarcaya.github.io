<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jean Carlo & Danaika - ¡Nos Casamos!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #8da491; /* Verde sage/eucalipto ideal para Pachacamac */
            --text-dark: #333333;
            --text-light: #666666;
            --bg-cream: #faf8f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Secciones */
        section {
            padding: 40px 20px;
            margin-bottom: 20px;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.1), transparent);
            margin: 20px 0;
        }

        /* Títulos Especiales */
        .script-font {
            font-family: 'Alex Brush', cursive;
            font-size: 3.5rem;
            color: var(--primary-color);
            line-height: 1;
        }

        h2 {
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        /* Header / Portada */
        header {
            padding: 60px 20px;
            background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.9)), url('https://images.unsplash.com/photo-1523438885200-e635ba2c371e?q=80&w=600&auto=format&fit=crop') center/cover;
        }

        .parents {
            font-size: 0.85rem;
            color: var(--text-light);
            margin: 20px 0;
        }

        .date-box {
            border-top: 1px solid var(--primary-color);
            border-bottom: 1px solid var(--primary-color);
            padding: 15px 0;
            margin: 30px auto;
            max-width: 80%;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Cronograma / Itinerario */
        .timeline-item {
            margin-bottom: 25px;
        }
        .time {
            font-weight: 600;
            color: var(--primary-color);
            display: block;
            font-size: 1.1rem;
        }

        /* Botones */
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            transition: background 0.3s;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #768a79;
        }

        /* Cuentas Bancarias */
        .account-card {
            background: #fdfdfd;
            border: 1px solid #eaeaea;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 0.9rem;
        }
        .bank-title {
            font-weight: 600;
            color: #004481; /* Azul BBVA */
            margin-bottom: 5px;
        }

        /* Footer */
        footer {
            font-size: 0.8rem;
            color: var(--text-light);
            padding: 30px 20px;
        }
    </style>
